<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Orbit Ring -->
  <circle cx="50" cy="50" r="44" stroke="#1B2A44" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- Angled Orbit Arc with glow -->
  <ellipse cx="50" cy="50" rx="46" ry="22" stroke="url(#blue-grad)" stroke-width="2.5" transform="rotate(-28 50 50)" stroke-linecap="round" />
  <circle cx="88" cy="32" r="3" fill="#7CC4FF" filter="url(#glow)" />
  
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="28" stroke="#4DA3E8" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Four-Point Compass Star / Cosmic Cross -->
  <path d="M50 14 L55 45 L86 50 L55 55 L50 86 L45 55 L14 50 L45 45 Z" fill="url(#star-grad)" filter="url(#glow)" />
  
  <!-- Center Core -->
  <circle cx="50" cy="50" r="4" fill="#FFFFFF" />

  <defs>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DA3E8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#7CC4FF" />
      <stop offset="100%" stop-color="#4DA3E8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="star-grad" x1="14" y1="14" x2="86" y2="86">
      <stop offset="0%" stop-color="#7CC4FF" />
      <stop offset="50%" stop-color="#4DA3E8" />
      <stop offset="100%" stop-color="#1B2A44" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
</svg>

