<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost in Space | COSMIC HUNT</title>
  <meta name="theme-color" content="#03060F" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body class="bg-bg text-text min-h-screen flex items-center justify-center starfield-bg p-4">
  <div class="starfield-container" aria-hidden="true">
    <div class="stars-layer-1"></div>
    <div class="stars-layer-2"></div>
    <div class="stars-layer-3"></div>
  </div>

  <div class="glass p-8 md:p-12 text-center space-y-6 max-w-md relative z-10">
    <div class="font-mono text-8xl font-bold text-primary-light/40">404</div>
    <h1 class="text-2xl font-heading font-bold text-white uppercase tracking-wider">LOST IN SPACE</h1>
    <p class="text-sm text-text-muted">This waypoint doesn't exist. You've drifted off course.</p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/" class="btn-primary px-6">RETURN TO BASE</a>
      <a href="/login" class="btn-secondary px-6">TEAM LOGIN</a>
    </div>
  </div>

</html>
